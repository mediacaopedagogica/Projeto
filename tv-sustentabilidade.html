<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Sustentabilidade</title>
<style>
html,body{margin:0;padding:0;background:#f5f1ea}
body{font-family:Arial,Helvetica,sans-serif}
.stage{position:relative;width:min(100%,1200px);margin:0 auto;line-height:0;overflow:hidden;background:#f5f1ea}
.stage>img{display:block;width:100%;height:auto}
.player{position:absolute;left:15.55%;top:9.78%;width:68.90%;height:65.46%;overflow:hidden;background:#000;line-height:normal}
.player iframe{display:block;width:100%;height:100%;border:0;background:#000}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="Televisão com vídeo sobre Design e Sustentabilidade">
  <img id="scene" alt="Televisão central em cenário com plantas, madeira, painel verde e elementos de design sustentável.">
  <div class="player">
    <iframe
      src="https://www.youtube.com/embed/W7-QKIz03dA?start=67&amp;rel=0&amp;playsinline=1"
      title="Todo designer precisa pensar em sustentabilidade?"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
  <span class="sr-only">O vídeo inicia em 1 minuto e 7 segundos e é reproduzido dentro da tela da televisão.</span>
</div>
<script>
fetch('tmp/tv-sustentabilidade/part01.txt',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('Imagem indisponível');return r.text()})
  .then(b64=>{document.getElementById('scene').src='data:image/jpeg;base64,'+b64.trim()})
  .catch(()=>{document.getElementById('stage').style.display='none'});
</script>
</body>
</html>
