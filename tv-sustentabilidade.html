<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Sustentabilidade</title>
<style>
html,body{margin:0;padding:0;background:transparent}
*{box-sizing:border-box}
.stage{position:relative;width:min(100%,1200px);margin:0 auto;line-height:0;overflow:hidden}
.stage>img{display:block;width:100%;height:auto;border:0}
.screen{position:absolute;left:8.2864%;top:8.2300%;width:83.4273%;height:72.3788%;overflow:hidden;line-height:normal}
.screen iframe{position:absolute;left:0;top:0;width:100%;height:129.6729%;border:0;display:block}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="stage" aria-label="Televisão exibindo vídeo sobre Design e Sustentabilidade">
  <img src="https://raw.githubusercontent.com/mediacaopedagogica/Projeto/main/tmp/tv-sustentabilidade/tv-sustentabilidade.png?v=8f6675d100f2f9231b0e3f65159f97546d3ce065" alt="Televisão em ambiente com plantas, madeira e elementos relacionados à sustentabilidade.">
  <div class="screen">
    <iframe
      src="https://www.youtube.com/embed/W7-QKIz03dA?start=67&amp;rel=0&amp;playsinline=1"
      title="Todo designer precisa pensar em sustentabilidade?"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
  <span class="sr-only">O vídeo inicia em 1 minuto e 7 segundos e é exibido dentro da tela da televisão.</span>
</div>
</body>
</html>
