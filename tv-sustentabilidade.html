<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Sustentabilidade</title>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.stage{position:relative;width:100%;max-width:1200px;margin:0 auto;aspect-ratio:1774/887;line-height:0;overflow:hidden}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;border:0}
/* Painéis laterais: transformam a abertura antiga muito larga em uma TV 16:9 real */
.speaker{position:absolute;top:8.22999%;height:72.37880%;background:repeating-linear-gradient(90deg,#232525 0,#232525 5px,#1b1d1d 5px,#1b1d1d 7px);box-shadow:inset 0 0 0 2px #343737,inset 0 0 28px rgba(0,0,0,.55);z-index:2}
.speaker.left{left:8.28636%;width:7.32807%}
.speaker.right{left:84.27283%;width:7.44081%}
/* Nova abertura medida e projetada em 1200x675 = 16:9 exatos */
.screen{position:absolute;left:16.12176%;top:6.31342%;width:67.64374%;height:76.09921%;overflow:hidden;background:#000;box-shadow:0 0 0 8px #1f2121,0 0 0 10px #4b4e4e;z-index:3}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="stage" aria-label="Televisão exibindo vídeo sobre Design e Sustentabilidade">
  <img src="https://raw.githubusercontent.com/mediacaopedagogica/Projeto/main/tmp/tv-sustentabilidade/tv-sustentabilidade.png?v=4ca2d39" alt="Televisão em ambiente com plantas e madeira.">
  <div class="speaker left" aria-hidden="true"></div>
  <div class="speaker right" aria-hidden="true"></div>
  <div class="screen">
    <iframe
      src="https://www.youtube.com/embed/W7-QKIz03dA?start=67&amp;rel=0&amp;playsinline=1"
      title="Todo designer precisa pensar em sustentabilidade?"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
  <span class="sr-only">O vídeo inicia em 1 minuto e 7 segundos e é exibido em uma tela 16 por 9 sem deformação.</span>
</div>
</body>
</html>
