<style>
*{box-sizing:border-box}html,body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111}body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(#efe8df,#ddd0be);padding:18px}.phone{width:min(390px,94vw);background:#fff;border:10px solid #111;border-radius:38px;box-shadow:0 28px 64px #0003;overflow:hidden;position:relative}.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:152px;height:28px;background:#111;border-radius:0 0 20px 20px;z-index:20}.status{height:42px;display:flex;align-items:end;justify-content:space-between;padding:10px 18px 6px;font-size:13px;font-weight:700}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #eee}.profile{display:flex;align-items:center;gap:10px}.ring{width:46px;height:46px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#8c6a3f,#dfc7a4,#7a5c38)}.avatar{width:100%;height:100%;border-radius:50%;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.name strong{display:block;font-size:15px}.name span{display:block;font-size:12px;color:#666;margin-top:3px}.menu{font-size:24px}.wrap{position:relative;background:#0a2535}.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}.carousel::-webkit-scrollbar{display:none}.slide{min-width:100%;scroll-snap-align:start;aspect-ratio:1122/1402;overflow:hidden;background:#0a2535}.slide img{width:100%;height:100%;object-fit:contain;display:block}.count{position:absolute;top:12px;right:12px;background:#0009;color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;z-index:6}.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:38px;height:38px;border:0;border-radius:50%;background:#0005;color:#fff;font-size:22px;cursor:pointer}.prev{left:10px}.next{right:10px}.article{position:absolute;right:12px;bottom:12px;z-index:7;width:58px;height:58px}.article img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #fff;box-shadow:0 8px 18px #0004}.actions{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 8px}.actions div{display:flex;gap:14px}.icon{border:0;background:transparent;padding:0;font-size:24px;cursor:pointer}.liked{color:#d63b58}.dots{display:flex;justify-content:center;gap:6px;padding:2px 0 12px}.dot{width:6px;height:6px;border-radius:99px;background:#d0d0d0}.dot.on{width:18px;background:#111}
</style></head><body><div class="phone"><div class="notch"></div><div class="status"><span>10:24</span><span>▮▮▮ ◌ ✦</span></div><div class="top"><div class="profile"><div class="ring"><div class="avatar"><img id="avatar" src="assets/ChatGPT%20Image%2014%20de%20set.%20de%202026%2C%2021_45_12%20%281%29.png" alt=""></div></div><div class="name"><strong>Imobiliária de luxo</strong><span>Pesquisa • Mercado • Alto padrão</span></div></div><div class="menu">•••</div></div><div class="wrap"><button class="arrow prev" id="prev">‹</button><button class="arrow next" id="next">›</button><div class="count" id="count">1/5</div><a class="article" href="https://ccsenet.org/journal/index.php/ijbm/article/view/0/52909" target="_blank" rel="noopener"><img src="assets/article.jpg" alt=""></a><div class="carousel" id="carousel"></div></div><div class="actions"><div><button class="icon" id="heart">♡</button><button class="icon">◯</button><button class="icon">⌁</button></div><div><button class="icon">▢</button></div></div><div class="dots" id="dots"></div></div><script>
const V='20260914-png-hd';
const files=['ChatGPT Image 14 de set. de 2026, 21_45_12 (1).png','ChatGPT Image 14 de set. de 2026, 21_45_13 (2).png','ChatGPT Image 14 de set. de 2026, 21_45_13 (3).png','ChatGPT Image 14 de set. de 2026, 21_45_13 (4).png','ChatGPT Image 14 de set. de 2026, 21_45_14 (5).png'];
const car=document.getElementById('carousel'),dots=document.getElementById('dots'),count=document.getElementById('count'),heart=document.getElementById('heart');let cur=0;files.forEach((f,i)=>{let s=document.createElement('section');s.className='slide';s.innerHTML=`<img src="assets/${encodeURIComponent(f)}?v=${V}" alt="">`;car.appendChild(s);let d=document.createElement('span');d.className='dot'+(i?'':' on');d.onclick=()=>go(i);dots.appendChild(d)});function render(){count.textContent=`${cur+1}/5`;[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===cur))}function go(n){cur=Math.max(0,Math.min(4,n));car.scrollTo({left:car.clientWidth*cur,behavior:'smooth'});render()}prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);car.addEventListener('scroll',()=>{cur=Math.round(car.scrollLeft/(car.clientWidth||1));render()},{passive:true});heart.onclick=()=>{heart.textContent=heart.textContent==='♡'?'♥':'♡';heart.classList.toggle('liked')};
</script></body></html>
