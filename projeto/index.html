<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Imobiliária de luxo</title>
<style>html,body{margin:0;width:100%;height:100%;background:#efe8df;font-family:Arial,sans-serif}#loading{height:100%;display:grid;place-items:center;color:#333;font-weight:700}</style>
</head>
<body>
<div id="loading">Carregando experiência…</div>
<script>
(async()=>{
  const files=['p01.b64','p02.b64','p03.b64','p04.b64','p05.b64','p06.b64','p07.b64','p08.b64','p09.b64','p10.b64','p11.b64','p12.b64'];
  const dec=new TextDecoder();
  let html='';
  for(const f of files){
    const r=await fetch('./parts/'+f,{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar '+f);
    const b64=(await r.text()).replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    html+=dec.decode(bytes);
  }
  document.open();document.write(html);document.close();
})().catch(e=>{document.getElementById('loading').textContent='Não foi possível carregar o conteúdo. Atualize a página.';console.error(e);});
</script>
</body>
</html>
