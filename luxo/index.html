<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design de luxo — Fórum de Interação</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{display:flex;justify-content:center;align-items:flex-start}iframe{width:100%;max-width:520px;height:790px;border:0;display:block;background:transparent}
</style>
</head>
<body>
<iframe id="designApp" src="../design_de_luxo_forum_mobile_final_v3.html" title="Design de luxo — Fórum de Interação" scrolling="no"></iframe>
<script>
const ARTICLE='https://doi.org/10.5539/ijbm.v21n2p65';
const frame=document.getElementById('designApp');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const w=frame.contentWindow;
    const caption=d.querySelector('.caption-area'); if(caption) caption.style.display='none';
    const modal=d.querySelector('.modal'); if(modal) modal.style.display='none';
    const phone=d.querySelector('.phone'); if(phone){phone.style.height='730px';phone.style.minHeight='730px'}
    d.body.style.minHeight='0'; d.body.style.padding='18px'; d.body.style.alignItems='start';
    const old=d.querySelector('.loupe-float');
    if(old){
      const fresh=old.cloneNode(true); old.replaceWith(fresh);
      fresh.setAttribute('aria-label','Abrir artigo científico');
      fresh.addEventListener('click',e=>{e.preventDefault();w.open(ARTICLE,'_blank','noopener')});
    }
    const feedback=d.getElementById('feedback');
    if(feedback && !feedback.textContent.includes('lupa')) feedback.textContent='Use as setinhas ou deslize para ver o carrossel. Toque na lupa para abrir o artigo.';
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
